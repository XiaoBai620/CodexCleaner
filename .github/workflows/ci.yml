name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test with synthetic data
        run: dotnet test -c Release
      - name: Publish single-file exe
        run: dotnet publish src/CodexCleaner -c Release -o dist
      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CodexCleaner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodexCleaner.exe" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CodexCleaner-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
