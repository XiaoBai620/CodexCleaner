name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test with synthetic data
        run: dotnet test tests/CodexCleaner.Tests -c Release --logger "console;verbosity=normal" --blame-hang-timeout 3m --blame-hang-dump-type none --results-directory TestResults
      - name: Publish exe
        run: dotnet publish src/CodexCleaner -c Release -o dist
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release.py verify
      - name: Write checksum
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: CodexCleaner-${{ github.sha }}
          path: |
            dist/CodexCleaner.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: CodexCleaner-${{ github.sha }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py notes
          gh release create "$TAG" dist/CodexCleaner.exe dist/SHA256SUMS.txt --title "CodexCleaner $TAG" --notes-file notes.md --verify-tag
