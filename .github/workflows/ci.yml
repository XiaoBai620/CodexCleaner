name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test with synthetic data
        run: dotnet test tests/CodexCleaner.Tests -c Release
      - name: Publish exe
        run: dotnet publish src/CodexCleaner -c Release -o dist
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/CodexCleaner/CodexCleaner.csproj -Raw -Encoding utf8)).Project.PropertyGroup.Version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match project version $version" }
      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CodexCleaner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodexCleaner.exe" | Set-Content -NoNewline -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: CodexCleaner-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: CodexCleaner-${{ github.sha }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' docs/CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/CodexCleaner.exe dist/SHA256SUMS.txt --title "CodexCleaner $TAG" --notes-file notes.md --verify-tag
