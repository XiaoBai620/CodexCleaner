name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and release manifest
        run: npm run check
      - name: Test with synthetic data
        run: npm test
      - name: Build and verify archives
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: CodexCleaner-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
